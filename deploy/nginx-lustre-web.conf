# Web-версия Lustre (статика из /var/www/lustre).
# Устанавливается: cp lustre-web.conf /etc/nginx/sites-available/ && ln -s ... sites-enabled/
# После указания A-записи DNS выпускается сертификат: certbot --nginx -d lustrehub.pro -d www.lustrehub.pro

# HTTP → HTTPS (появится после certbot; до этого сервер статику отдаёт по http)
server {
    listen 80;
    listen [::]:80;
    server_name lustrehub.pro www.lustrehub.pro;

    # Один адрес сайта: www уводим на основной домен. API разрешает запросы только с lustrehub.pro,
    # и на www-адресе все его запросы блокировались как ошибка CORS — сайт выглядел «без связи»
    if ($host = www.lustrehub.pro) {
        return 301 https://lustrehub.pro$request_uri;
    }

    root /var/www/lustre;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # Статика из assets/ кэшируется, index.html всегда свежий
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Страницы (в т.ч. SEO-страницы store/index.html, games/12/index.html) всегда свежие,
    # иначе браузер держит старый HTML со ссылками на уже удалённые файлы сборки.
    # Для остальных адресов SPA — index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
