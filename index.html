  <body>
    <!-- Заставка при запуске десктопного лаунчера: логотип с глитчем и «загрузка системы».
         Только главное окно Electron и только первый запуск за сессию; веб и
         служебные окна (чат, оверлей, обновление) её не видят. Скрывает main.tsx. -->
    <div id="boot-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:100001;background:#060309;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;font-family:'Tiny5','VT323',monospace;color:#f7e9f3;overflow:hidden">
      <style>
        #boot-splash .bs-grid{position:absolute;inset:-60px;background-image:linear-gradient(to right,rgba(255,45,143,.08) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,45,143,.08) 1px,transparent 1px);background-size:40px 40px;animation:bs-pan 3s linear infinite;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 50%,#000,transparent 70%)}
        #boot-splash .bs-logo{position:relative;font-size:64px;letter-spacing:.12em;color:#fff;text-shadow:0 0 24px rgba(255,45,143,.8);animation:bs-in .6s cubic-bezier(.22,1,.36,1) both}
        #boot-splash .bs-logo::before,#boot-splash .bs-logo::after{content:'LUSTRE';position:absolute;left:0;top:0;width:100%}
        #boot-splash .bs-logo::before{color:#22d3ee;clip-path:inset(0 0 55% 0);animation:bs-g1 1.6s infinite steps(1)}
        #boot-splash .bs-logo::after{color:#ff2d8f;clip-path:inset(55% 0 0 0);animation:bs-g2 1.9s infinite steps(1)}
        #boot-splash .bs-bar{position:relative;width:240px;height:6px;border:1px solid rgba(255,45,143,.6);padding:1px}
        #boot-splash .bs-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff2d8f,#8338ec);box-shadow:0 0 10px #ff2d8f;animation:bs-load 1.1s cubic-bezier(.4,0,.2,1) forwards}
        #boot-splash .bs-log{font-family:'VT323',monospace;font-size:16px;letter-spacing:.14em;color:#bf9fb5;min-height:20px;text-transform:uppercase}
        #boot-splash .bs-log b{color:#ff2d8f;font-weight:400}
        #boot-splash .bs-scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.25) 3px,transparent 4px);pointer-events:none}
        @keyframes bs-pan{to{transform:translate(40px,40px)}}
        @keyframes bs-in{from{opacity:0;transform:scale(1.15);filter:blur(6px)}}
        @keyframes bs-load{to{width:100%}}
        @keyframes bs-g1{0%,80%,100%{transform:translateX(-2px)}84%{transform:translateX(5px)}90%{transform:translateX(-4px)}}
        @keyframes bs-g2{0%,76%,100%{transform:translateX(2px)}82%{transform:translateX(-5px)}92%{transform:translateX(3px)}}
        @media (prefers-reduced-motion:reduce){#boot-splash *{animation:none!important}#boot-splash .bs-bar i{width:100%}}
      </style>
      <div class="bs-grid"></div>
      <div class="bs-logo">LUSTRE</div>
      <div class="bs-bar"><i></i></div>
      <div class="bs-log" id="bs-log">// boot sequence</div>
      <div class="bs-scan"></div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('boot-splash');
        var h = location.hash || '';
        var secondary = /overlay|chat-window|friends-window|update|account-picker/.test(h);
        var seen = false;
        try { seen = sessionStorage.getItem('lustre_splash') === '1'; } catch (e) {}
        if (!window.electron || secondary || seen) { el.remove(); window.__lustreSplashHide = function () {}; return; }
        try { sessionStorage.setItem('lustre_splash', '1'); } catch (e) {}
        el.style.display = 'flex';
        var started = Date.now();
        var lines = ['init <b>core</b>', 'mount <b>library</b>', 'sync <b>network</b>', 'ready<b>_</b>'];
        var log = document.getElementById('bs-log'), i = 0;
        var timer = setInterval(function () { if (i < lines.length) log.innerHTML = '// ' + lines[i++]; }, 260);
        window.__lustreSplashHide = function () {
          var wait = Math.max(0, 1250 - (Date.now() - started));
          setTimeout(function () {
            clearInterval(timer);
            el.style.transition = 'opacity .45s ease';
            el.style.opacity = '0';
            setTimeout(function () { el.remove(); }, 500);
          }, wait);
        };
        // страховка: заставка не должна зависнуть, даже если приложение упало при старте
        setTimeout(function () { window.__lustreSplashHide(); }, 6000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
